name: CI

# One pipeline with six jobs, each started only if the one before it has
# passed: lint and unit tests, data preparation, training and evaluation,
# registration and export of the model, the Docker image of the API, and the
# deployment of that image on GKE together with Prometheus and Grafana.
# Every job runs on a new machine, so the files a later job needs are uploaded
# by one job and downloaded by the next.
on:
  push:
    branches: [main]
    # pushes that change only documents, notebooks or report material do not
    # affect the model, the image or the deployment
    paths-ignore:
      - "**.md"
      - "notebooks/**"
      - "report/**"
      - "screenshots/**"
  workflow_dispatch:

# the jobs only read the repository, unless a job asks for more
permissions:
  contents: read

env:
  IMAGE: heart-disease-api

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -v --junitxml=ci-output/unit-tests.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: ci-output/

  prepare-data:
    # not started if lint or a test has failed
    needs: lint-and-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        # with this shell a step fails if any command in a pipe fails
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Step 2 - prepare the data
        run: |
          mkdir -p ci-output
          python -m pipeline.step2_prepare_data 2>&1 | tee -a ci-output/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prepare-data-log
          path: ci-output/

      - name: Upload clean data
        uses: actions/upload-artifact@v7
        with:
          name: clean-data
          path: data/processed/heart_clean.csv
          if-no-files-found: error

  train-evaluate:
    # not started if the data preparation has failed
    needs: prepare-data
    runs-on: ubuntu-24.04
    defaults:
      run:
        # with this shell a step fails if any command in a pipe fails
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      # the clean data prepared by the prepare-data job of this run
      - name: Get the clean data
        uses: actions/download-artifact@v8
        with:
          name: clean-data
          path: data/processed/

      - name: Step 3 - train the models
        run: |
          mkdir -p ci-output
          python -m pipeline.step3_train_models 2>&1 | tee -a ci-output/pipeline.log

      # ends with an error if the selected model fails the quality gate
      - name: Step 4 - evaluate the selected model
        run: python -m pipeline.step4_evaluate_model 2>&1 | tee -a ci-output/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-evaluate-log
          path: ci-output/

      # the MLflow store with the training runs, before any registration
      - name: Upload trained models
        uses: actions/upload-artifact@v7
        with:
          name: trained-models
          path: |
            mlflow.db
            mlruns/
          if-no-files-found: error

  register-export:
    # not started if the selected model has failed the quality gate
    needs: train-evaluate
    runs-on: ubuntu-24.04
    defaults:
      run:
        # with this shell a step fails if any command in a pipe fails
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      # the hash of this file is written on the registered model version
      - name: Get the clean data
        uses: actions/download-artifact@v8
        with:
          name: clean-data
          path: data/processed/

      # the MLflow store left by the train-evaluate job of this run
      - name: Get the trained models
        uses: actions/download-artifact@v8
        with:
          name: trained-models
          path: .

      - name: Step 5 - register the model
        run: |
          mkdir -p ci-output
          python -m pipeline.step5_register_model 2>&1 | tee -a ci-output/pipeline.log

      - name: Step 6 - export the champion
        run: python -m pipeline.step6_export_model 2>&1 | tee -a ci-output/pipeline.log

      # loads the exported model on its own, without the MLflow database
      - name: Step 7 - check the exported model
        run: python -m pipeline.step7_validate_model 2>&1 | tee -a ci-output/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: register-export-log
          path: ci-output/

      - name: Upload champion model
        uses: actions/upload-artifact@v7
        with:
          name: champion-model
          path: models/champion/
          if-no-files-found: error

      - name: Upload MLflow store
        uses: actions/upload-artifact@v7
        with:
          name: mlflow-store
          path: |
            mlflow.db
            mlruns/

  build:
    # not started if the model has not been exported
    needs: register-export
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # to upload the image to the GitHub registry
      packages: write
    defaults:
      run:
        # with this shell a step fails if any command in a pipe fails
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # the model exported by the register-export job of this run
      - name: Get the champion model
        uses: actions/download-artifact@v8
        with:
          name: champion-model
          path: models/champion/

      - name: Build the image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Start the container
        run: |
          mkdir -p ci-output
          docker run -d --name api -p 8000:8000 $IMAGE:${{ github.sha }}

      # /health answers with an error until the model is loaded
      - name: Wait until the model is loaded
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The service did not become ready"
          exit 1

      - name: Show the model being served
        run: curl --silent --fail http://127.0.0.1:8000/model-info | tee ci-output/model-info.json

      # the reply must have a prediction of 0 or 1 and a confidence of 0.5 to 1
      - name: Send the sample request
        run: |
          curl --silent --fail -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d @api/sample_request.json | tee ci-output/prediction.json
          jq --exit-status \
            '(.prediction == 0 or .prediction == 1) and .confidence >= 0.5 and .confidence <= 1' \
            ci-output/prediction.json

      # a code that is not valid must be refused with status 422
      - name: Send a wrong request
        run: |
          status=$(jq '.cp = 9' api/sample_request.json | curl --silent \
            --output ci-output/refused.json --write-out "%{http_code}" \
            -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" -d @-)
          cat ci-output/refused.json
          test "$status" = "422"

      # the two requests above must be counted in the metrics
      - name: Check the metrics
        run: |
          curl --silent --fail http://127.0.0.1:8000/metrics | tee ci-output/metrics.txt
          grep -F 'api_requests_total{path="/predict",status="200"} 1.0' ci-output/metrics.txt
          grep -F 'api_requests_total{path="/predict",status="422"} 1.0' ci-output/metrics.txt

      - name: Save the container log
        if: always()
        run: docker logs api > ci-output/container.log 2>&1 || true

      - name: Upload the replies and the container log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-check
          path: ci-output/

      # reached only if every check above has passed; the tag is the commit number
      - name: Upload the image to the GitHub registry
        if: github.ref == 'refs/heads/main'
        run: |
          target=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE:${{ github.sha }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag $IMAGE:${{ github.sha }} $target
          for attempt in 1 2 3; do
            if docker push $target; then
              exit 0
            fi
            echo "Upload failed, attempt $attempt of 3"
            sleep 10
          done
          exit 1

  deploy:
    # not started if the image has failed a check; skipped where the Google
    # Cloud variables are not set, as in a fork of the repository
    needs: build
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    # One deployment at a time. A deployment that is waiting is replaced by a
    # newer one, so an older image never replaces a newer one on the cluster.
    concurrency:
      group: deploy-gke
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      # to ask GitHub for the token that Google Cloud accepts as the login
      id-token: write
    defaults:
      run:
        # with this shell a step fails if any command in a pipe fails
        shell: bash
    env:
      REGION: asia-south1
      REGISTRY: heart-disease
      CLUSTER: heart-disease-cluster
      RELEASE: heart-disease-api
      # versions of the community charts of the monitoring
      PROMETHEUS_CHART: 29.35.0
      GRAFANA_CHART: 13.2.7

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # no key is stored; Google Cloud accepts the token of this repository
      - name: Log in to Google Cloud
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Copy the image to the Google registry
        run: |
          source=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE:${{ github.sha }}
          repository=$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$REGISTRY/$IMAGE
          echo "REPOSITORY=$repository" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ steps.google.outputs.access_token }}" | docker login $REGION-docker.pkg.dev -u oauth2accesstoken --password-stdin
          docker pull $source
          docker tag $source $repository:${{ github.sha }}
          for attempt in 1 2 3; do
            if docker push $repository:${{ github.sha }}; then
              exit 0
            fi
            echo "Upload failed, attempt $attempt of 3"
            sleep 10
          done
          exit 1

      - name: Connect to the cluster
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      # waits until the new copies are ready; the old ones serve till then
      - name: Install the Helm chart
        run: |
          helm version --short
          helm upgrade --install $RELEASE deployment/helm/heart-disease-api \
            --set image.repository=$REPOSITORY \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Show what is running
        if: always()
        run: |
          mkdir -p ci-output
          kubectl get deployment,pods,service -l app=$RELEASE -o wide | tee ci-output/cluster.txt

      - name: Get the public address
        run: |
          address=$(kubectl get service $RELEASE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          test -n "$address"
          echo "API_URL=http://$address" >> "$GITHUB_ENV"
          echo "The API is at http://$address"

      - name: Show the model being served
        run: curl --silent --fail $API_URL/model-info | tee ci-output/model-info.json

      # the reply must have a prediction of 0 or 1 and a confidence of 0.5 to 1
      - name: Send the sample request
        run: |
          curl --silent --fail -X POST $API_URL/predict \
            -H "Content-Type: application/json" \
            -d @api/sample_request.json | tee ci-output/prediction.json
          jq --exit-status \
            '(.prediction == 0 or .prediction == 1) and .confidence >= 0.5 and .confidence <= 1' \
            ci-output/prediction.json

      - name: Check the metrics
        run: |
          curl --silent --fail $API_URL/metrics | tee ci-output/metrics.txt
          grep -F 'api_model_loaded 1.0' ci-output/metrics.txt

      # the permission of Prometheus to list pods is created once by hand
      # (prometheus-access.yaml); nothing changes on the cluster if the
      # settings are the same as in the previous run
      - name: Install Prometheus and Grafana
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm upgrade --install prometheus prometheus-community/prometheus \
            --version $PROMETHEUS_CHART \
            -f deployment/monitoring/prometheus-values.yaml \
            --wait --timeout 5m
          helm upgrade --install grafana grafana-community/grafana \
            --version $GRAFANA_CHART \
            -f deployment/monitoring/grafana-values.yaml \
            --set-file dashboards.default.heart-disease-api.json=deployment/monitoring/dashboards/heart-disease-api.json \
            --wait --timeout 5m

      # every API pod must be found and read by Prometheus; the first reading
      # can take up to one scrape interval after Prometheus starts
      - name: Check that Prometheus reads the API pods
        run: |
          pods=$(kubectl get deployment $RELEASE -o jsonpath='{.spec.replicas}')
          query="sum(up{job=\"kubernetes-pods\",app=\"$RELEASE\"})"
          for attempt in $(seq 1 12); do
            found=$(kubectl exec deploy/prometheus-server -c prometheus-server -- \
              wget -qO- "http://localhost:9090/api/v1/query?query=$query" \
              | jq -r '.data.result[0].value[1] // "0"')
            echo "API pods read by Prometheus: $found of $pods"
            if [ "$found" = "$pods" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Upload the replies from the deployed API
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-check
          path: ci-output/
