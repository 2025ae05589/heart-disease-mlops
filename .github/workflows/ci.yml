name: CI

# One pipeline with three jobs, each started only if the one before it has
# passed: lint and unit tests, training, and the Docker image of the API.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -v --junitxml=ci-output/unit-tests.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: ci-output/

  train:
    # not started if lint or a test has failed
    needs: lint-and-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        # with this shell a step fails if any command in a pipe fails
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Step 2 - prepare the data
        run: |
          mkdir -p ci-output
          python -m pipeline.step2_prepare_data 2>&1 | tee -a ci-output/pipeline.log

      - name: Step 3 - train the models
        run: python -m pipeline.step3_train_models 2>&1 | tee -a ci-output/pipeline.log

      # ends with an error if the selected model fails the quality gate
      - name: Step 4 - evaluate the selected model
        run: python -m pipeline.step4_evaluate_model 2>&1 | tee -a ci-output/pipeline.log

      - name: Step 5 - register the model
        run: python -m pipeline.step5_register_model 2>&1 | tee -a ci-output/pipeline.log

      - name: Step 6 - export the champion
        run: python -m pipeline.step6_export_model 2>&1 | tee -a ci-output/pipeline.log

      # loads the exported model on its own, without the MLflow database
      - name: Step 7 - check the exported model
        run: python -m pipeline.step7_validate_model 2>&1 | tee -a ci-output/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-log
          path: ci-output/

      - name: Upload champion model
        uses: actions/upload-artifact@v7
        with:
          name: champion-model
          path: models/champion/
          if-no-files-found: error

      - name: Upload MLflow store
        uses: actions/upload-artifact@v7
        with:
          name: mlflow-store
          path: |
            mlflow.db
            mlruns/

  docker:
    # not started if the training has failed
    needs: train
    runs-on: ubuntu-24.04
    defaults:
      run:
        # with this shell a step fails if any command in a pipe fails
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # the model exported by the train job of this run
      - name: Get the champion model
        uses: actions/download-artifact@v8
        with:
          name: champion-model
          path: models/champion/

      - name: Build the image
        run: docker build -t heart-disease-api:${{ github.sha }} .

      - name: Start the container
        run: |
          mkdir -p ci-output
          docker run -d --name api -p 8000:8000 heart-disease-api:${{ github.sha }}

      # /health answers with an error until the model is loaded
      - name: Wait until the model is loaded
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The service did not become ready"
          exit 1

      - name: Show the model being served
        run: curl --silent --fail http://127.0.0.1:8000/model-info | tee ci-output/model-info.json

      # the reply must have a prediction of 0 or 1 and a confidence of 0.5 to 1
      - name: Send the sample request
        run: |
          curl --silent --fail -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d @api/sample_request.json | tee ci-output/prediction.json
          jq --exit-status \
            '(.prediction == 0 or .prediction == 1) and .confidence >= 0.5 and .confidence <= 1' \
            ci-output/prediction.json

      # a code that is not valid must be refused with status 422
      - name: Send a wrong request
        run: |
          status=$(jq '.cp = 9' api/sample_request.json | curl --silent \
            --output ci-output/refused.json --write-out "%{http_code}" \
            -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" -d @-)
          cat ci-output/refused.json
          test "$status" = "422"

      - name: Save the container log
        if: always()
        run: docker logs api > ci-output/container.log 2>&1 || true

      - name: Upload the replies and the container log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-check
          path: ci-output/
