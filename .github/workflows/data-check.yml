name: Data check

# Weekly check of the source data.
#
# Every Monday the four UCI files are downloaded again and their hashes are
# compared with the ones recorded in src/config.py. Nothing is committed and
# no model is trained by this workflow. There are three cases:
#
# 1. No change: the run passes.
# 2. A file has changed: the check stops with an error, so that the run
#    shows red on GitHub and the change is noticed. The new data is reviewed
#    by a person. If it is accepted, the recorded hash is updated, steps 1
#    and 2 are run again and the data files are committed. That push starts
#    the training workflow (train.yml).
# 3. The site cannot be reached: the check could not be done and the run
#    fails. The data is not in question; the check is run again later.
#
# The error line in the log shows which of the two it is.
on:
  schedule:
    - cron: "30 3 * * 1"  # 03:30 UTC, 9:00 AM in India
  workflow_dispatch:

jobs:
  check-source-data:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      # ends with an error if a file has changed or the site cannot be reached
      - name: Step 1 - download the data and check the hashes
        run: python -m pipeline.step1_download_data
