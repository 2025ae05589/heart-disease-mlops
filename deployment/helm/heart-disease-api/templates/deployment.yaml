# Deployment of the prediction API: runs the configured number of replicas
# and replaces any replica that fails.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      # Prometheus scrapes the pods that carry these annotations
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.containerPort }}"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          # the installation stops with this message if no tag is given
          image: "{{ .Values.image.repository }}:{{ required "image.tag has to be given: --set image.tag=<commit SHA>" .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.containerPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # up to 60 seconds are allowed for a new replica to load the model
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
            periodSeconds: 5
            failureThreshold: 12
          # requests are routed to a replica only while it reports ready
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
          # a replica that stops responding is restarted
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
