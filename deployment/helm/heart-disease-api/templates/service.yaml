# Service of the prediction API: a single endpoint that distributes requests
# across the replicas that report ready.

apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Chart.Name }}
  ports:
    # external port of the service, and the target port of the container
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
