# Values of the chart. Any of them can be changed at the time of installing,
# for example:
#   --set image.repository=<registry address> --set image.tag=<commit SHA>

image:
  # the public image; the CI pipeline overrides it with the image built in
  # its own run
  repository: ghcr.io/2025ae05589/heart-disease-api
  # Each image is tagged with the SHA of the commit it was built from. The tag
  # has no default: it has to be given when installing, so that it is always
  # known which version is running.
  tag: ""

# number of replicas of the API
replicaCount: 2

# port on which the API listens inside the container
containerPort: 8000

service:
  # LoadBalancer exposes one external IP address and distributes the requests
  # across the replicas
  type: LoadBalancer
  # external port of the service
  port: 80

# one running replica was measured at about 195 MiB of memory
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"
